services:
  - type: web
    name: diagnostico-maturidade-digital
    runtime: node
    plan: free
    branch: claude/conversational-experience-m1vgqk
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
